name: CI — Church App

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  server:
    name: Server typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run type-check

  client:
    name: Client typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm run type-check
      - working-directory: client
        # Real smoke test for a static-export Next.js app — output:'export' means
        # a successful build is the strongest signal short of actually deploying.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.offerings.stmaryselthuruth.org/api
